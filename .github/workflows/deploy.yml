name: deploy

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'package.json', 'package-lock.json', 'firebase.json']
  workflow_dispatch:

concurrency: deploy

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          for v in VITE_FB_API_KEY VITE_FB_AUTH_DOMAIN VITE_FB_PROJECT_ID VITE_FB_APP_ID VITE_ADMIN_EMAIL; do
            [ -n "${!v}" ] || { echo "::error::Missing repository variable $v (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          done
          npm run build
        env:
          VITE_FB_API_KEY: ${{ vars.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ vars.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ vars.VITE_FB_PROJECT_ID }}
          VITE_FB_APP_ID: ${{ vars.VITE_FB_APP_ID }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: frontline-world
          channelId: live
